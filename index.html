<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #233b36;
      background: #c4d2cf;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .museum {
      --glass-background: rgba(247, 246, 237, 0.28);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-blur: blur(16px) saturate(1.15);
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100vh;
      min-height: 100svh;
    }

    /* 将同一张水乡图片铺到目录后面，供透明面板透出和虚化。 */
    .museum::before {
      content: "";
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      z-index: 0;
      background: url('./assets/misc/hall-bg.png') left center / auto 100% no-repeat;
      filter: sepia(0.3) saturate(0.85) brightness(0.95);
      pointer-events: none;
    }

    .museum::after {
      content: "";
      grid-column: 1 / -1;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      z-index: 0;
      background: url('./assets/misc/hall-bg.png') center / cover no-repeat;
      filter: sepia(0.3) saturate(0.85) brightness(0.95);
      pointer-events: none;
    }

    /* 两块信息面板共用；调大字号只改 --panel-font-size，其他层级按比例跟随。 */
    .catalog, .culture {
      --panel-font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      --panel-font-size: 16px;
      --panel-title-size: calc(var(--panel-font-size) * 1.1875);
      --panel-meta-size: calc(var(--panel-font-size) * 0.8125);
      --panel-line-height: 1.8;
      --panel-weight: 400;
      --panel-emphasis-weight: 600;
      --panel-radius: 4px;
      --panel-border-width: 1px;
      --panel-border-color: #9aafa7;
      --panel-background: #b7c7c2;
      --panel-text: #233b36;
      --panel-muted: #425e50;
      --panel-accent: #355c48;
      --panel-hover: #aabeb5;
      --panel-selected: #a2b8ac;
      --panel-selected-hover: #93ad9e;
      --panel-focus-width: 2px;
      --panel-focus-offset: 3px;
      --panel-space-compact: 8px;
      --panel-space-relaxed: 16px;
      --panel-space-small-screen: 6px;

      padding: calc(var(--panel-space) * 2);
      border: var(--panel-border-width) solid var(--panel-border-color);
      border-radius: var(--panel-radius);
      background: var(--panel-background);
      color: var(--panel-text);
      font-family: var(--panel-font-family);
      font-size: var(--panel-font-size);
      font-weight: var(--panel-weight);
      line-height: var(--panel-line-height);
    }

    /* 目录的首屏配色单独管理，解说区继续使用原有配色。 */
    .catalog {
      --panel-space: var(--panel-space-compact);
      --panel-background: transparent;
      --panel-border-color: var(--glass-border);
      --panel-text: #303c32;
      --panel-accent: #4d655a;
      --panel-hover: rgba(255, 255, 255, 0.4);
      --panel-selected: rgba(255, 255, 255, 0.18);
      --panel-selected-hover: rgba(255, 255, 255, 0.28);
      --panel-selected-text: #303c32;
      --logo-font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      --logo-font-size: calc(var(--panel-font-size) * 1.5);
      --logo-letter-spacing: 0.06em;
      grid-column: 1;
      grid-row: 1;
      position: relative;
      z-index: 1;
    }
    .stage-controls {
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
    }
    .catalog, .stage-controls, .culture {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 4px 20px rgba(35, 59, 54, 0.08);
    }
    .culture {
      --panel-space: var(--panel-space-relaxed);
      --panel-background: transparent;
      --panel-border-color: var(--glass-border);
      --panel-hover: rgba(255, 255, 255, 0.4);
      --panel-selected: rgba(255, 255, 255, 0.18);
      --panel-selected-hover: rgba(255, 255, 255, 0.28);
    }

    .catalog ul {
      display: flex;
      flex-direction: column;
      gap: var(--panel-space);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .catalog button, .culture-tabs button {
      padding: calc(var(--panel-space) * 0.75) var(--panel-space);
      border: var(--panel-border-width) solid transparent;
      border-radius: var(--panel-radius);
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .catalog button {
      width: 100%;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .catalog button:hover, .culture-tabs button:hover {
      background: var(--panel-hover);
      border-color: var(--panel-border-color);
    }

    .catalog button[aria-current="true"], .culture-tabs button[aria-selected="true"] {
      border-color: var(--panel-accent);
      background: var(--panel-selected);
      font-weight: var(--panel-emphasis-weight);
    }

    .catalog button[aria-current="true"]:hover, .culture-tabs button[aria-selected="true"]:hover {
      background: var(--panel-selected-hover);
    }

    .catalog button[aria-current="true"] { color: var(--panel-selected-text); }

    #umbrella-list button {
      background: transparent;
      border-color: transparent;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      font-family: var(--logo-font-family);
      font-size: var(--logo-font-size);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: var(--logo-letter-spacing);
      color: #263b34;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .pattern-catalog { display: none; margin-top: calc(var(--panel-space) * 2); }
    .pattern-catalog h3 { font-size: var(--panel-font-size); }
    .pattern-catalog button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 68px;
    }
    .pattern-preview { width: 76px; height: 52px; object-fit: contain; flex: 0 0 auto; }
    .pattern-catalog button[aria-pressed="false"] {
      background: transparent;
      border-color: transparent;
      border-bottom-color: rgba(255, 255, 255, 0.5);
      border-radius: 0;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    .pattern-catalog button[aria-pressed="false"] .pattern-preview {
      filter: brightness(0.7) saturate(0.55);
      opacity: 0.7;
    }
    .pattern-catalog button[aria-pressed="true"] {
      background: var(--panel-selected);
      border-color: var(--glass-border);
      color: var(--panel-selected-text);
      font-weight: var(--panel-emphasis-weight);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 2px 8px rgba(35, 59, 54, 0.08);
    }
    .pattern-catalog button[aria-pressed="true"]:hover { background: var(--panel-selected-hover); }

    .catalog :focus-visible, .culture :focus-visible {
      outline: var(--panel-focus-width) solid var(--panel-accent);
      outline-offset: var(--panel-focus-offset);
    }

    .catalog h3, .culture h3 {
      margin: 0 0 var(--panel-space);
      font-size: var(--panel-title-size);
      font-weight: var(--panel-emphasis-weight);
      line-height: var(--panel-line-height);
    }

    .stage {
      position: relative;
      min-width: 0;
      height: 100vh;
      height: 100svh;
      isolation: isolate;
      overflow: hidden;
      background: #b7c4a0;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -24px;
      z-index: -1;
      background: url('./assets/misc/hall-bg.png') center / cover no-repeat;
      filter: blur(2px) sepia(0.3) saturate(0.85) brightness(0.95);
      opacity: 1;
      pointer-events: none;
    }

    #viewport { position: absolute; inset: 0; }
    #viewport canvas { display: block; touch-action: none; }

    .stage-controls {
      position: absolute;
      right: 28px;
      bottom: 28px;
      display: grid;
      gap: 18px;
      width: 210px;
      margin: 0;
      padding: 18px;
      border: 1px solid var(--glass-border);
      background: var(--glass-background);
      color: #334838;
    }

    .settings-toggle { display: none; }

    .control-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .stage-controls input[type="range"] {
      width: 100%; height: 24px; margin: 0;
      appearance: none; -webkit-appearance: none;
      background: transparent; cursor: pointer;
    }
    .stage-controls input[type="range"]::-webkit-slider-runnable-track {
      height: 8px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 3px rgba(35, 59, 54, 0.18);
    }
    .stage-controls input[type="range"]::-webkit-slider-thumb {
      appearance: none; -webkit-appearance: none;
      width: 24px; height: 24px; margin-top: -9px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(241, 246, 243, 0.65);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 3px #ffffff, 0 2px 6px rgba(35, 59, 54, 0.25);
    }
    .stage-controls input[type="range"]::-moz-range-track {
      height: 8px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 3px rgba(35, 59, 54, 0.18);
    }
    .stage-controls input[type="range"]::-moz-range-thumb {
      width: 24px; height: 24px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(241, 246, 243, 0.65);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 3px #ffffff, 0 2px 6px rgba(35, 59, 54, 0.25);
    }
    .plain-canopy-option { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; cursor: pointer; }
    .stage-controls .plain-canopy-option input { width: 18px; height: 18px; margin: 0; flex: 0 0 auto; accent-color: #64766c; }
    .stage-controls select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.24);
      color: inherit;
      font: inherit;
    }

    .stage-controls :focus-visible { outline: 2px solid #355c48; outline-offset: 3px; }
    #stage-status { position: absolute; top: 24px; left: 28px; right: 28px; margin: 0; color: #334838; }
    #stage-status:empty { display: none; }

    .culture {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .culture-tabs button[aria-selected="true"] {
      border-color: var(--glass-border);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 2px 8px rgba(35, 59, 54, 0.08);
    }

    .culture-tabs {
      display: flex;
      gap: var(--panel-space);
      padding-bottom: var(--panel-space);
      border-bottom: var(--panel-border-width) solid var(--panel-border-color);
    }
    .culture-panel { padding-top: calc(var(--panel-space) * 2); }
    .culture-entry + .culture-entry { margin-top: calc(var(--panel-space) * 2); }
    .culture p { margin: 0 0 var(--panel-space); overflow-wrap: anywhere; }
    .culture-level, .culture-source {
      font-size: var(--panel-meta-size);
      line-height: var(--panel-line-height);
      color: var(--panel-muted);
    }
    .culture-source summary {
      padding: calc(var(--panel-space) * 0.75) var(--panel-space);
      border: var(--panel-border-width) solid transparent;
      border-radius: var(--panel-radius);
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    .culture-source summary:hover { background: var(--panel-hover); border-color: var(--panel-border-color); }
    .culture-source p { margin-top: var(--panel-space); }
    .culture-source a { color: inherit; text-underline-offset: var(--panel-focus-offset); }
    .culture-source a:hover { color: var(--panel-accent); background: var(--panel-hover); }
    .craft-steps { margin: 0; padding: 0; list-style: none; }
    .craft-step {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: calc(var(--panel-space) * 2);
      align-items: start;
      padding: calc(var(--panel-space) * 2) 0;
    }
    .craft-step:first-child { padding-top: 0; }
    .craft-step + .craft-step { border-top: var(--panel-border-width) solid var(--panel-border-color); }
    .craft-step img { display: block; width: 100%; height: auto; }

    /* 桌面展台下沿对齐约 85% 屏高；移动端沿用下方原有高度。 */
    @media (min-width: 768px) {
      .stage {
        height: 85vh;
        height: 85svh;
      }
      .catalog { max-height: 85vh; max-height: 85svh; overflow-y: auto; }
      .culture { grid-column: 1 / -1; }
      #umbrella-list { display: none; }
      .pattern-catalog { display: block; margin-top: 0; }
      .pattern-dropdown { display: none; }
    }

    @media (max-width: 767px), (max-width: 1024px) and (max-height: 600px) and (pointer: coarse) {
      .museum { grid-template-columns: minmax(0, 1fr); }
      .museum::before { display: none; }
      .museum::after { grid-row: 2; }

      .stage {
        --mobile-controls-height: 112px;
        grid-column: 1;
        grid-row: 1;
        height: calc(50vh + var(--mobile-controls-height));
        height: calc(50dvh + var(--mobile-controls-height));
        min-height: 0;
      }

      #viewport { bottom: var(--mobile-controls-height); }
      .stage.settings-collapsed { --mobile-controls-height: 0px; }
      .stage.settings-collapsed .stage-controls { display: none; }
      .settings-toggle {
        display: grid;
        place-items: center;
        position: absolute;
        right: 16px;
        bottom: calc(var(--mobile-controls-height) + 12px);
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--glass-border);
        border-radius: 50%;
        background: var(--glass-background);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        color: #334838;
        font-size: 24px;
        cursor: pointer;
      }
      .settings-toggle:focus-visible { outline: 2px solid #355c48; outline-offset: 3px; }

      .stage-controls {
        left: 0;
        right: 0;
        bottom: 0;
        width: auto;
        min-width: 0;
        height: var(--mobile-controls-height);
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-color: transparent;
        background: transparent;
        box-shadow: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .stage-controls > div { min-width: 0; }
      .stage-controls .control-label { margin-bottom: 4px; }
      .stage-controls input, .stage-controls select { height: 44px; }
      .stage-controls select { font-size: 16px; }

      .catalog {
        --panel-space: var(--panel-space-small-screen);
        --logo-font-size: 20px;
        max-height: none;
        overflow-y: visible;
        grid-column: 1;
        grid-row: 1;
        align-self: start;
        min-width: 0;
        padding: 12px 16px;
        border: 0;
        box-shadow: none;
        pointer-events: none;
      }
      .catalog ul { flex-direction: row; overflow-x: auto; }
      #umbrella-list { display: flex; }
      #umbrella-list button { padding: 0; pointer-events: auto; }
      .catalog li { flex: 0 0 auto; }
      .catalog button { min-height: 44px; white-space: nowrap; }
      .pattern-catalog { display: none; }
      .pattern-dropdown { display: block; }

      .culture {
        grid-column: 1;
        grid-row: 2;
        padding: var(--panel-space);
      }
      .culture-tabs { gap: calc(var(--panel-space) / 2); }
      .culture-tabs button { flex: 1; padding-inline: 0; text-align: center; }
      .craft-step { grid-template-columns: minmax(0, 1fr); gap: var(--panel-space); }
      .craft-step img { max-width: 320px; margin-inline: auto; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="museum">
    <nav class="catalog">
      <ul id="umbrella-list"></ul>
      <section class="pattern-catalog" aria-labelledby="pattern-heading">
        <h3 id="pattern-heading">纹样切换</h3>
        <ul id="pattern-list"></ul>
      </section>
    </nav>
    <main id="stage" class="stage">
      <div id="viewport" data-presentation="hall"></div>
      <p id="stage-status" role="status"></p>
      <button id="settings-toggle" class="settings-toggle" type="button" aria-expanded="true" aria-controls="stage-controls" aria-label="收起设置" title="收起设置">⌄</button>
      <fieldset id="stage-controls" class="stage-controls" disabled>
        <div>
          <div class="control-label">
            <label for="open-amount">开合</label>
            <output id="open-value" for="open-amount"></output>
          </div>
          <input id="open-amount" type="range" min="0" max="1" step="0.01" value="1">
          <label class="plain-canopy-option"><input id="plain-canopy" type="checkbox">查看无纹理样式</label>
        </div>
        <div class="pattern-dropdown">
          <label class="control-label" for="pattern">纹样切换</label>
          <select id="pattern"></select>
        </div>
      </fieldset>
    </main>
    <section class="culture">
      <div class="culture-tabs" role="tablist" aria-label="文化解说">
        <button id="tab-shape" type="button" role="tab" aria-selected="true" aria-controls="panel-shape">形制</button>
        <button id="tab-craft" type="button" role="tab" aria-selected="false" aria-controls="panel-craft" tabindex="-1">工艺</button>
        <button id="tab-pattern" type="button" role="tab" aria-selected="false" aria-controls="panel-pattern" tabindex="-1">纹样</button>
      </div>
      <div id="panel-shape" class="culture-panel" role="tabpanel" aria-labelledby="tab-shape" tabindex="0"></div>
      <div id="panel-craft" class="culture-panel" role="tabpanel" aria-labelledby="tab-craft" tabindex="0" hidden></div>
      <div id="panel-pattern" class="culture-panel" role="tabpanel" aria-labelledby="tab-pattern" tabindex="0" hidden></div>
    </section>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
